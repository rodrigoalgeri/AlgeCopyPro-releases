name: Publicar AlgeCopy Pro 1.2.5
on:
  push:
    branches: [codex/publish-1.2.5]
    paths: [staging/1.2.5/package.zip, scripts/publish-1.2.5.mjs]
permissions:
  contents: write
concurrency:
  group: publicar-algecopy-1.2.5
  cancel-in-progress: false
jobs:
  publicar:
    if: github.repository == 'rodrigoalgeri/AlgeCopyPro-releases'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obter pacote assinado e scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Conferir arquivo do Actions privado
        shell: bash
        run: |
          echo 'ce816615ab707096898e2ffa7dc52dd9a27ba73ea1d7cea6c9b49114724f0328  staging/1.2.5/package.zip' | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/algecopy-1.2.5"
          unzip -q staging/1.2.5/package.zip -d "$RUNNER_TEMP/algecopy-1.2.5"
      - name: Validar assinatura e publicar atualização
        env:
          GH_TOKEN: ${{ github.token }}
          ALGE_PACKAGE: ${{ runner.temp }}/algecopy-1.2.5
        run: node scripts/publish-1.2.5.mjs
