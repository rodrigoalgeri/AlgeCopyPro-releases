name: Publicar AlgeCopy Pro 1.4.0
on:
  push:
    branches: [codex/publish-1.4.0]
    paths: [staging/1.4.0/package.zip, scripts/publish-1.4.0.mjs]
permissions:
  contents: write
concurrency:
  group: publicar-algecopy-1.4.0
  cancel-in-progress: false
jobs:
  publicar:
    if: github.repository == 'rodrigoalgeri/AlgeCopyPro-releases'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obter pacote assinado e scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Conferir arquivo do Actions privado
        shell: bash
        run: |
          echo 'e560430bed4b2c222e1bb68e093017abe275e0acc0e47dec06ac8f25e8475e25  staging/1.4.0/package.zip' | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/algecopy-1.4.0"
          unzip -q staging/1.4.0/package.zip -d "$RUNNER_TEMP/algecopy-1.4.0"
      - name: Validar assinatura e publicar atualização
        env:
          GH_TOKEN: ${{ github.token }}
          ALGE_PACKAGE: ${{ runner.temp }}/algecopy-1.4.0
        run: node scripts/publish-1.4.0.mjs
