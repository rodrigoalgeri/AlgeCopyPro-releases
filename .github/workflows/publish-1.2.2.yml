name: Publicar AlgeCopy Pro 1.2.2
on:
  push:
    branches: [codex/publish-1.2.2]
    paths: [staging/1.2.2/package.zip, scripts/publish-1.2.2.mjs]
permissions:
  contents: write
concurrency:
  group: publicar-algecopy-1.2.2
  cancel-in-progress: false
jobs:
  publicar:
    if: github.repository == 'rodrigoalgeri/AlgeCopyPro-releases'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obter pacote assinado e scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Conferir arquivo do Actions privado
        shell: bash
        run: |
          echo 'a085199b850ad9bd1802492cf7dcc446a337587b6c448f4664746f5b6f5a0460  staging/1.2.2/package.zip' | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/algecopy-1.2.2"
          unzip -q staging/1.2.2/package.zip -d "$RUNNER_TEMP/algecopy-1.2.2"
      - name: Validar assinatura e publicar atualização
        env:
          GH_TOKEN: ${{ github.token }}
          ALGE_PACKAGE: ${{ runner.temp }}/algecopy-1.2.2
        run: node scripts/publish-1.2.2.mjs
