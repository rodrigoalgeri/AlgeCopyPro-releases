name: Publicar AlgeCopy Pro 1.2.4
on:
  push:
    branches: [codex/publish-1.2.4]
    paths: [staging/1.2.4/package.zip, scripts/publish-1.2.4.mjs]
permissions:
  contents: write
concurrency:
  group: publicar-algecopy-1.2.4
  cancel-in-progress: false
jobs:
  publicar:
    if: github.repository == 'rodrigoalgeri/AlgeCopyPro-releases'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obter pacote assinado e scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Conferir arquivo do Actions privado
        shell: bash
        run: |
          echo 'a7a251f3a6ec374a5d5e780b9ddf21cb98d5c26e4509d5538b6bd1bd2578e59b  staging/1.2.4/package.zip' | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/algecopy-1.2.4"
          unzip -q staging/1.2.4/package.zip -d "$RUNNER_TEMP/algecopy-1.2.4"
      - name: Validar assinatura e publicar atualização
        env:
          GH_TOKEN: ${{ github.token }}
          ALGE_PACKAGE: ${{ runner.temp }}/algecopy-1.2.4
        run: node scripts/publish-1.2.4.mjs
