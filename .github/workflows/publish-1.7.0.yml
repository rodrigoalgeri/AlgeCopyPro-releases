name: Publicar AlgeCopy Pro 1.7.0
on:
  push:
    branches: [codex/publish-1.7.0]
    paths: [staging/1.7.0/package.zip, scripts/publish-1.7.0.mjs]
permissions:
  contents: write
concurrency:
  group: publicar-algecopy-1.7.0
  cancel-in-progress: false
jobs:
  publicar:
    if: github.repository == 'rodrigoalgeri/AlgeCopyPro-releases'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obter pacote assinado e scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Conferir pacote assinado da versão
        shell: bash
        run: |
          echo 'bd6f36be28a69f1921438f2c74c0d79507a909e6f71152d2b552a35d0b169cbd  staging/1.7.0/package.zip' | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/algecopy-1.7.0"
          unzip -q staging/1.7.0/package.zip -d "$RUNNER_TEMP/algecopy-1.7.0"
      - name: Validar assinatura e publicar atualização
        env:
          GH_TOKEN: ${{ github.token }}
          ALGE_PACKAGE: ${{ runner.temp }}/algecopy-1.7.0
        run: node scripts/publish-1.7.0.mjs

